<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <style>
                    .custom-breadcrumb {
                        display: inline-flex;
                        align-items: center;
                        background: #f8f9fa;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 6px 15px;
                        font-size: 13px;
                        margin-bottom: 15px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                    }
                    .custom-breadcrumb a {
                        color: #4a4a4a;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        font-weight: 500;
                    }
                    .custom-breadcrumb a:hover {
                        color: #337ab7;
                    }
                    .custom-breadcrumb .separator {
                        margin: 0 10px;
                        color: #a0a0a0;
                        font-size: 11px;
                    }
                    .custom-breadcrumb .active {
                        color: #337ab7;
                        font-weight: 600;
                    }
                </style>
                <div class="custom-breadcrumb">
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
                    <i class="fa fa-chevron-right separator"></i>
                    <a href="#">Aset</a>
                    <i class="fa fa-chevron-right separator"></i>
                    <span class="active">Kategori Aset</span>
                </div>

                <h3 class="panel-title" style="margin-top: 5px;">Master Kategori Aset</h3>
            </div>
            <div class="panel-body">
                <div class="row clearfix" style="margin-bottom: 20px;">
                    <div class="col-md-6">
                        <button type="button" class="btn btn-primary" id="btn-tambah-kategori-aset">
                            <i class="fa fa-plus"></i> Tambah Kategori
                        </button>
                        <button type="button" class="btn btn-warning" data-toggle="modal" data-target="#modal-import-kategori-aset" style="margin-left: 5px;"><i class="fa fa-upload"></i> Import</button>
                    </div>
                    <div class="col-md-6">
                        <form class="searchbox-masterkategoriaset" onsubmit="event.preventDefault(); loadMasterKategoriAset(0);">
                            <div class="input-group">
                                <input type="text" id="cari_kategori_aset" class="form-control" placeholder="Cari Kode atau Nama Kategori...">
                                <span class="input-group-btn">
                                    <button class="btn btn-default" type="submit"><i class="fa fa-search"></i> Cari</button>
                                </span>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover no-margin" id="table-master-kategori-aset">
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Nama Kategori</th>
                                <th>KIB Default</th>
                                <th>Umur Manfaat</th>
                                <th>COA</th>
                                <th>Status</th>
                                <th class="text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="master-kategori-aset-list">
                        </tbody>
                    </table>
                </div>
                
                <div class="row clearfix" style="margin-top: 15px;">
                    <div class="col-md-12 text-right">
                        <div id="pagination-kategori-aset"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>

<!-- Modal Form Kategori Aset -->
<div class="modal fade" id="modal-form-kategori-aset" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">Form Kategori Aset</h4>
            </div>
            <form id="form-kategori-aset" method="POST">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Kode Kategori <span class="text-danger">*</span></label>
                        <input type="text" name="kode_kategori" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Kategori Aset <span class="text-danger">*</span></label>
                        <input type="text" name="nama_kategori" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>KIB Default</label>
                        <select name="kib_default" class="form-control">
                            <option value="">-- Tidak Ada --</option>
                            <option value="A">KIB A (Tanah)</option>
                            <option value="B">KIB B (Peralatan & Mesin)</option>
                            <option value="C">KIB C (Gedung & Bangunan)</option>
                            <option value="D">KIB D (Jalan, Irigasi & Jaringan)</option>
                            <option value="E">KIB E (Aset Tetap Lainnya)</option>
                            <option value="F">KIB F (Konstruksi dlm Pengerjaan)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Umur Manfaat Default (Tahun)</label>
                        <input type="number" name="umur_manfaat_default" class="form-control" value="0" min="0">
                    </div>
                    <div class="form-group">
                        <label>Kode Akun / COA (Opsional)</label>
                        <input type="text" name="kode_coa" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Status Aktif</label>
                        <select name="status_aktif" class="form-control">
                            <option value="Aktif">Aktif</option>
                            <option value="Nonaktif">Nonaktif</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-kategori-aset">Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Import Kategori Aset -->
<div class="modal fade" id="modal-import-kategori-aset" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="form-import-kategori-aset" enctype="multipart/form-data">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">Import Data Kategori Aset</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Pilih File CSV</label>
                        <input type="file" name="file" class="form-control" accept=".csv" required>
                        <p class="help-block">Pastikan format kolom sesuai dengan template CSV.</p>
                    </div>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'downloadTemplateCSV'])?}?type=kategori_aset" target="_blank" class="btn btn-default btn-sm"><i class="fa fa-download"></i> Download Template CSV</a>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-import-kategori-aset">Mulai Import</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
var currentOffset = 0;

function loadMasterKategoriAset(offset) {
    currentOffset = offset;
    var cari = $('#cari_kategori_aset').val();
    $('#master-kategori-aset-list').html('<tr><td colspan="6" class="text-center"><i class="fa fa-spinner fa-spin"></i> Memuat...</td></tr>');
    
    $.ajax({
        url: '{?=url([ADMIN, "logistik_non_medis", "displayMasterKategoriAset"])?}',
        method: 'GET',
        data: { offset: offset, cari: cari },
        dataType: 'json',
        success: function(res) {
            var html = '';
            if(res.rows.length > 0) {
                $.each(res.rows, function(i, val) {
                    html += '<tr>';
                    html += '<td>' + val.kode_kategori + '</td>';
                    html += '<td>' + val.nama_kategori + '</td>';
                    html += '<td>' + (val.kib_default ? 'KIB ' + val.kib_default : '-') + '</td>';
                    html += '<td>' + val.umur_manfaat_default + ' Thn</td>';
                    html += '<td><span class="label label-' + (val.status_aktif == 'Aktif' ? 'success' : 'default') + '">' + val.status_aktif + '</span></td>';
                    html += '<td class="text-right">';
                    html += '<button type="button" class="btn btn-xs btn-info btn-edit-kategori-aset" data-kode="' + val.kode_kategori + '"><i class="fa fa-pencil"></i></button> ';
                    html += '<button type="button" class="btn btn-xs btn-danger btn-hapus-kategori-aset" data-kode="' + val.kode_kategori + '"><i class="fa fa-trash"></i></button>';
                    html += '</td>';
                    html += '</tr>';
                });
            } else {
                html = '<tr><td colspan="6" class="text-center">Data tidak ditemukan.</td></tr>';
            }
            $('#master-kategori-aset-list').html(html);
            
            // Build pagination simplistic
            var total = res.total;
            var totalPages = Math.ceil(total / 10);
            var currentPage = (offset / 10) + 1;
            var pagHtml = '<ul class="pagination pagination-sm" style="margin:0;">';
            if(currentPage > 1) {
                pagHtml += '<li><a href="#" onclick="loadMasterKategoriAset(' + (offset - 10) + '); return false;">&laquo;</a></li>';
            }
            pagHtml += '<li class="active"><a href="#">' + currentPage + ' / ' + (totalPages == 0 ? 1 : totalPages) + '</a></li>';
            if(currentPage < totalPages) {
                pagHtml += '<li><a href="#" onclick="loadMasterKategoriAset(' + (offset + 10) + '); return false;">&raquo;</a></li>';
            }
            pagHtml += '</ul>';
            $('#pagination-kategori-aset').html(pagHtml);
        },
        error: function(xhr, status, error) {
            $('#master-kategori-aset-list').html('<tr><td colspan="6" class="text-center text-danger"><i class="fa fa-exclamation-triangle"></i> Gagal memuat data. ' + error + '</td></tr>');
        }
    });
}

$(document).ready(function() {
    loadMasterKategoriAset(0);
    
    $('#btn-tambah-kategori-aset').click(function() {
        $('#form-kategori-aset')[0].reset();
        $('#form-kategori-aset input[name="kode_kategori"]').prop('readonly', false);
        $('#modal-form-kategori-aset').modal('show');
    });
    
    $(document).on('click', '.btn-edit-kategori-aset', function() {
        var kode = $(this).data('kode');
        $.ajax({
            url: '{?=url([ADMIN, "logistik_non_medis", "formMasterKategoriAset"])?}',
            method: 'GET',
            data: { kode: kode },
            dataType: 'json',
            success: function(data) {
                if(data.kode_kategori) {
                    $('#form-kategori-aset input[name="kode_kategori"]').val(data.kode_kategori).prop('readonly', true);
                    $('#form-kategori-aset input[name="nama_kategori"]').val(data.nama_kategori);
                    $('#form-kategori-aset select[name="kib_default"]').val(data.kib_default);
                    $('#form-kategori-aset input[name="umur_manfaat_default"]').val(data.umur_manfaat_default);
                    $('#form-kategori-aset select[name="status_aktif"]').val(data.status_aktif);
                    $('#modal-form-kategori-aset').modal('show');
                }
            }
        });
    });
    
    $('#form-kategori-aset').submit(function(e) {
        e.preventDefault();
        $('#btn-save-kategori-aset').prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Menyimpan...');
        $.ajax({
            url: '{?=url([ADMIN, "logistik_non_medis", "saveMasterKategoriAset"])?}',
            method: 'POST',
            data: $(this).serialize(),
            dataType: 'json',
            success: function(res) {
                if(res.status == 'success') {
                    $('#modal-form-kategori-aset').modal('hide');
                    loadMasterKategoriAset(currentOffset);
                } else {
                    alert(res.message);
                }
            },
            complete: function() {
                $('#btn-save-kategori-aset').prop('disabled', false).html('Simpan');
            }
        });
    });
    
    $(document).on('click', '.btn-hapus-kategori-aset', function() {
        if(confirm('Yakin ingin menghapus kategori aset ini?')) {
            var kode = $(this).data('kode');
            $.ajax({
                url: '{?=url([ADMIN, "logistik_non_medis", "hapusMasterKategoriAset"])?}',
                method: 'POST',
                data: { kode_kategori: kode },
                success: function() {
                    loadMasterKategoriAset(0);
                }
            });
        }
    });

    $('#form-import-kategori-aset').on('submit', function(e) {
        e.preventDefault();
        var formData = new FormData(this);
        formData.append('type', 'kategori_aset');
        var btn = $('#btn-submit-import-kategori-aset');
        btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Mengimpor...');
        
        $.ajax({
            url: "{?=url([ADMIN, 'logistik_non_medis', 'postImportCSV'])?}",
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(res) {
                var data = JSON.parse(res);
                if (data.status == 'success') {
                    alert(data.message);
                    $('#modal-import-kategori-aset').modal('hide');
                    loadMasterKategoriAset(currentOffset);
                } else {
                    alert(data.message);
                }
            },
            error: function() {
                alert('Terjadi kesalahan saat mengimpor data.');
            },
            complete: function() {
                btn.prop('disabled', false).html('Mulai Import');
            }
        });
    });
});
</script>
