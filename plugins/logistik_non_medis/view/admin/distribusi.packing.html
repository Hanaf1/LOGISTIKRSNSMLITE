<div class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <style>
                    .custom-breadcrumb {
                        display: inline-flex;
                        align-items: center;
                        background: #f8f9fa;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 6px 15px;
                        font-size: 13px;
                        margin-bottom: 15px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                    }
                    .custom-breadcrumb a {
                        color: #4a4a4a;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        font-weight: 500;
                    }
                    .custom-breadcrumb a:hover {
                        color: #337ab7;
                    }
                    .custom-breadcrumb .separator {
                        margin: 0 10px;
                        color: #a0a0a0;
                        font-size: 11px;
                    }
                    .custom-breadcrumb .active {
                        color: #337ab7;
                        font-weight: 600;
                    }
                </style>
                <div class="custom-breadcrumb">
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
                    <i class="fa fa-chevron-right separator"></i>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Distribusi</a>
                    <i class="fa fa-chevron-right separator"></i>
                    <span class="active">Packing</span>
                </div>

                <h3 class="panel-title" style="margin-top: 5px;">Picking & Packing SPPB</h3>
            </div>
            <div class="panel-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" id="cari_packing" class="form-control" placeholder="Cari No. SPPB...">
                            <span class="input-group-btn">
                                <button class="btn btn-primary" type="button" onclick="loadPacking()"><i class="fa fa-search"></i> Cari</button>
                            </span>
                        </div>
                    </div>
                </div>
                <div id="display_packing"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPacking" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div id="form_packing_content"></div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    loadPacking();
});

function loadPacking(halaman = 1) {
    var cari = $('#cari_packing').val();
    $.post('{?=url(ADMIN."/logistik_non_medis/displaydistribusipacking")?}', {
        halaman: halaman,
        cari: cari
    }, function(data) {
        $('#display_packing').html(data);
    });
}

function openPicking(no_sppb) {
    $.post('{?=url(ADMIN."/logistik_non_medis/formpicking")?}', {
        no_sppb: no_sppb
    }, function(data) {
        $('#form_packing_content').html(data);
        $('#modalPacking').modal('show');
    });
}

function openPacking(no_sppb) {
    $.post('{?=url(ADMIN."/logistik_non_medis/formpacking")?}', {
        no_sppb: no_sppb
    }, function(data) {
        $('#form_packing_content').html(data);
        $('#modalPacking').modal('show');
    });
}
</script>
