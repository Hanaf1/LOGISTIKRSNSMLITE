<div class="row">
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading">
        <div class="custom-breadcrumb" style="display:inline-flex;align-items:center;background:#f8f9fa;border:1px solid #e1e4e8;border-radius:6px;padding:6px 15px;font-size:13px;margin-bottom:15px;box-shadow:0 1px 2px rgba(0,0,0,.05);">
          <a href="{?=url([ADMIN,'logistik_non_medis','manage'])?}" style="color:#4a4a4a;text-decoration:none;"><i class="fa fa-home"></i></a>
          <i class="fa fa-chevron-right" style="margin:0 10px;color:#aaa;font-size:11px;"></i>
          <a href="{?=url([ADMIN,'logistik_non_medis','asetkib'])?}" style="color:#4a4a4a;text-decoration:none;">Aset</a>
          <i class="fa fa-chevron-right" style="margin:0 10px;color:#aaa;font-size:11px;"></i>
          <span style="color:#337ab7;font-weight:600;">KIB Inventaris</span>
        </div>
        <h3 class="panel-title"><i class="fa fa-folder-open"></i> Kartu Inventaris Barang</h3>
      </div>
      <div class="panel-body">
        <div class="well well-sm" style="margin-bottom:15px;">
          <form id="form-filter-kib" onsubmit="return false;">
            <div class="row">
              <div class="col-md-3">
                <label>Pencarian</label>
                <input type="text" id="filter_cari" class="form-control" placeholder="Kode aset, nama barang, nomor inventaris...">
              </div>
              <div class="col-md-3">
                <label>Unit</label>
                <select id="filter_unit" class="form-control">
                  <option value="">Semua Unit</option>
                  {loop: $units}
            <option value="{$value.kode}">{$value.kode_inventaris} - {$value.nama}</option>
                  {/loop}
                </select>
              </div>
              <div class="col-md-2">
                <label>Kelompok</label>
                <select id="filter_kelompok" class="form-control">
                  <option value="">Semua Kelompok</option>
                  {loop: $kelompok}
                  <option value="{$value.kode_kelompok}">{$value.kode_kelompok} - {$value.nama_kelompok}</option>
                  {/loop}
                </select>
              </div>
              <div class="col-md-2">
                <label>Jenis Barang</label>
                <select id="filter_jenis" class="form-control">
                  <option value="">Semua Jenis</option>
                  {loop: $jenis}
                  <option value="{$value.kode_kelompok}.{$value.kode_jenis}" data-kelompok="{$value.kode_kelompok}">{$value.kode_kelompok}.{$value.kode_jenis} - {$value.nama_jenis}</option>
                  {/loop}
                </select>
              </div>
              <div class="col-md-2" style="padding-top:25px;">
                <button type="button" class="btn btn-default btn-block btn-reset-filter"><i class="fa fa-refresh"></i> Reset</button>
              </div>
            </div>
          </form>
        </div>

        <div id="kib-content-loader" style="display:none;text-align:center;padding:45px 0;">
          <i class="fa fa-spinner fa-spin fa-2x text-primary"></i>
          <p style="margin-top:10px;color:#777;">Memuat data inventaris...</p>
        </div>
        <div id="kib-ajax-container"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modal-detail-aset" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content" id="detail-aset-content"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4"></script>
<script>
var current_page = 1;

$(function() {
  loadKib(1);

  var searchTimeout;
  $('#filter_cari').on('keyup', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function(){ loadKib(1); }, 300);
  });

  $('#filter_unit,#filter_kelompok,#filter_jenis').on('change', function() {
    if (this.id === 'filter_kelompok') {
      var kelompok = $(this).val();
      $('#filter_jenis option').show();
      if (kelompok) $('#filter_jenis option[data-kelompok]').not('[data-kelompok="'+kelompok+'"]').hide();
      $('#filter_jenis').val('');
    }
    loadKib(1);
  });

  $('.btn-reset-filter').on('click', function() {
    $('#form-filter-kib')[0].reset();
    $('#filter_jenis option').show();
    loadKib(1);
  });

  $(document).on('click', '.pagination a', function(e) {
    e.preventDefault();
    var page = $(this).attr('data-page');
    if (page) loadKib(page);
  });

  $(document).on('click', '.btn-detail-aset', function() {
    var id = $(this).attr('data-id');
    $('#detail-aset-content').html('<div class="text-center" style="padding:50px;"><i class="fa fa-spinner fa-spin fa-2x"></i><p>Memuat detail aset...</p></div>');
    $('#modal-detail-aset').modal('show');
    $.post('{?=url([ADMIN,"logistik_non_medis","detailasetregistrasi"])?}', {id:id}, function(html) {
      $('#detail-aset-content').html(html);
    }).fail(function() {
      $('#detail-aset-content').html('<div class="modal-body"><div class="alert alert-danger">Gagal memuat detail aset.</div></div>');
    });
  });
});

function loadKib(page) {
  current_page = page || 1;
  $.ajax({
    url: '{?=url([ADMIN,"logistik_non_medis","displaykib"])?}',
    type: 'POST',
    data: {
      halaman: current_page,
      cari: $('#filter_cari').val(),
      filter_unit: $('#filter_unit').val(),
      filter_kelompok: $('#filter_kelompok').val(),
      filter_jenis: $('#filter_jenis').val()
    },
    beforeSend: function() {
      $('#kib-ajax-container').hide();
      $('#kib-content-loader').show();
    },
    success: function(html) {
      $('#kib-content-loader').hide();
      $('#kib-ajax-container').html(html).fadeIn(150);
    },
    error: function() {
      $('#kib-content-loader').hide();
      $('#kib-ajax-container').html('<div class="alert alert-danger">Data KIB gagal dimuat.</div>').show();
    }
  });
}
</script>
