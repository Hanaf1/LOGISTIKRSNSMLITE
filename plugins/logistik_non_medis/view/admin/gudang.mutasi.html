<div class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <style>
                    .custom-breadcrumb {
                        display: inline-flex;
                        align-items: center;
                        background: #f8f9fa;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 6px 15px;
                        font-size: 13px;
                        margin-bottom: 15px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                    }
                    .custom-breadcrumb a {
                        color: #4a4a4a;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        font-weight: 500;
                    }
                    .custom-breadcrumb a:hover {
                        color: #337ab7;
                    }
                    .custom-breadcrumb .separator {
                        margin: 0 10px;
                        color: #a0a0a0;
                        font-size: 11px;
                    }
                    .custom-breadcrumb .active {
                        color: #337ab7;
                        font-weight: 600;
                    }
                </style>
                <div class="custom-breadcrumb">
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
                    <i class="fa fa-chevron-right separator"></i>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Gudang</a>
                    <i class="fa fa-chevron-right separator"></i>
                    <span class="active">Mutasi</span>
                </div>

                <h3 class="panel-title" style="margin-top: 5px;"><i class="fa fa-exchange"></i> Mutasi Antar Gudang</h3>
            </div>
            <div class="panel-body">
                <ul class="nav nav-tabs" role="tablist">
                    <li role="presentation" class="active"><a href="#daftar-mutasi" aria-controls="daftar-mutasi" role="tab" data-toggle="tab">Daftar Mutasi</a></li>
                    <li role="presentation"><a href="#kartu-stok" aria-controls="kartu-stok" role="tab" data-toggle="tab">Kartu Stok (Histori)</a></li>
                </ul>

                <div class="tab-content" style="padding-top: 20px;">
                    <!-- TAB DAFTAR MUTASI -->
                    <div role="tabpanel" class="tab-pane active" id="daftar-mutasi">
                        <div class="row">
                            <div class="col-md-8">
                                <button class="btn btn-primary" onclick="tambahMutasi()"><i class="fa fa-plus"></i> Tambah Mutasi</button>
                                <div class="btn-group" style="margin-left: 10px;">
                                    <button type="button" class="btn btn-success dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                        <i class="fa fa-file-excel-o"></i> CSV Options <span class="caret"></span>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li><a href="{?=url(ADMIN."/logistik_non_medis/downloadtemplatemutasicsv")?}"><i class="fa fa-download"></i> Download Template CSV</a></li>
                                        <li><a href="javascript:void(0)" onclick="$('#modal-import-csv').modal('show')"><i class="fa fa-upload"></i> Import CSV</a></li>
                                        <li role="separator" class="divider"></li>
                                        <li><a href="javascript:void(0)" onclick="$('#modal-export-csv').modal('show')"><i class="fa fa-file-text-o"></i> Export CSV Filter</a></li>
                                    </ul>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="input-group">
                                    <input type="text" id="cari-mutasi" class="form-control" placeholder="Cari no mutasi / lokasi...">
                                    <span class="input-group-btn">
                                        <button class="btn btn-default" id="btn-cari-mutasi"><i class="fa fa-search"></i></button>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div id="display-mutasi" style="margin-top: 20px;">
                            <div class="text-center" style="padding: 50px;"><i class="fa fa-spinner fa-spin fa-3x"></i></div>
                        </div>
                    </div>

                    <!-- TAB KARTU STOK -->
                    <div role="tabpanel" class="tab-pane" id="kartu-stok">
                        <div class="row">
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label>Pilih Barang</label>
                                    <select id="filter-item-mutasi" class="form-control" style="width: 100%;">
                                        <option value="">-- Semua Barang --</option>
                                        {loop: $items}
                                        <option value="{$value.kode_item}">{$value.kode_item} - {$value.nama_barang}</option>
                                        {/loop}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label>Pilih Lokasi</label>
                                    <select id="filter-lokasi-mutasi" class="form-control" style="width: 100%;">
                                        <option value="">-- Semua Lokasi --</option>
                                        {loop: $lokasi}
                                        <option value="{$value.kode_lokasi}">{$value.nama_lokasi}</option>
                                        {/loop}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="form-group">
                                    <label>Dari Tanggal</label>
                                    <input type="text" id="tgl-awal" class="form-control datepicker" value="{?=date('Y-m-01')?}">
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="form-group">
                                    <label>Sampai Tanggal</label>
                                    <input type="text" id="tgl-akhir" class="form-control datepicker" value="{?=date('Y-m-d')?}">
                                </div>
                            </div>
                            <div class="col-md-2" style="padding-top: 25px;">
                                <button class="btn btn-primary btn-block" id="btn-filter-kartu"><i class="fa fa-search"></i> Tampilkan</button>
                            </div>
                        </div>
                        <div id="display-kartu-stok" style="margin-top: 20px;">
                            <div class="alert alert-info">
                                <i class="fa fa-info-circle"></i> Silakan pilih barang dan periode tanggal untuk menampilkan kartu stok.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Form Mutasi -->
<div class="modal fade" id="modalMutasi" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <!-- Content loaded via AJAX -->
        </div>
    </div>
</div>

<script>

$('#form-import-csv').submit(function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    $.ajax({
        url: '{?=url(ADMIN."/logistik_non_medis/importmutasicsv")?}',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        success: function(res) {
            var r = JSON.parse(res);
            if (r.status == 'success') {
                $('#modal-import-csv').modal('hide');
                loadDaftarMutasi();
                alert(r.message);
            } else {
                alert(r.message);
            }
        }
    });
});


$(document).ready(function() {
    $('.datepicker').datetimepicker({
        format: 'YYYY-MM-DD',
        locale: 'id'
    });





    loadMutasi();

    // Auto-filter if coming from Stock Management
    {if: !empty($selected_item)}
        $('#filter-item-mutasi').val('{$selected_item}').trigger('change').trigger('change.select2');
        $('a[href="#kartu-stok"]').tab('show');
        setTimeout(function() {
            $('#btn-filter-kartu').click();
        }, 800);
    {/if}

    $('#btn-cari-mutasi').click(function() {
        loadMutasi();
    });

    $('#cari-mutasi').keypress(function(e) {
        if(e.which == 13) loadMutasi();
    });

    $('#btn-filter-kartu').click(function() {
        var item = $('#filter-item-mutasi').val();
        var lokasi = $('#filter-lokasi-mutasi').val();
        var tgl1 = $('#tgl-awal').val();
        var tgl2 = $('#tgl-akhir').val();
        
        console.log("Filtering for Item:", item, "Location:", lokasi, "Dates:", tgl1, tgl2);
        
        if(!item) {
            alert('Pilih barang terlebih dahulu!');
            return;
        }

        $('#display-kartu-stok').html('<div class="text-center" style="padding: 50px;"><i class="fa fa-spinner fa-spin fa-3x"></i></div>');

        $.post('{?=url(ADMIN."/logistik_non_medis/displaykartustok")?}', {
            kode_item: item,
            kode_lokasi: lokasi,
            tgl_awal: tgl1,
            tgl_akhir: tgl2
        }, function(data) {
            console.log("Kartu Stok Data Received");
            $('#display-kartu-stok').html(data);
        }).fail(function(xhr, status, error) {
            console.error("AJAX Error:", status, error);
            alert("Gagal memuat data kartu stok.");
        });
    });
});

function loadMutasi(hal = 1) {
    var cari = $('#cari-mutasi').val();
    $('#display-mutasi').html('<div class="text-center" style="padding: 50px;"><i class="fa fa-spinner fa-spin fa-3x"></i></div>');
    $.post('{?=url(ADMIN."/logistik_non_medis/displaymutasi")?}', {
        halaman: hal,
        cari: cari
    }, function(data) {
        $('#display-mutasi').html(data);
    });
}

function tambahMutasi() {
    $.post('{?=url(ADMIN."/logistik_non_medis/formmutasi")?}', { mode: 'add' }, function(data) {
        $('#modalMutasi .modal-content').html(data);
        $('#modalMutasi').modal('show');
    });
}

function editMutasi(no) {
    $.post('{?=url(ADMIN."/logistik_non_medis/formmutasi")?}', { mode: 'edit', no_mutasi: no }, function(data) {
        $('#modalMutasi .modal-content').html(data);
        $('#modalMutasi').modal('show');
    });
}

function detailMutasi(no) {
    $.post('{?=url(ADMIN."/logistik_non_medis/detailmutasi")?}', { no_mutasi: no }, function(data) {
        $('#modalMutasi .modal-content').html(data);
        $('#modalMutasi').modal('show');
    });
}

function prosesMutasi(no, action) {
    var msg = "Apakah Anda yakin ingin memproses mutasi ini?";
    if(action == 'batal') msg = "Apakah Anda yakin ingin membatalkan mutasi ini?";
    
    if(confirm(msg)) {
        $.post('{?=url(ADMIN."/logistik_non_medis/prosesmutasi")?}', { no_mutasi: no, action: action }, function(res) {
            var data = JSON.parse(res);
            if(data.status == 'success') {
                loadMutasi();
                if($('#modalMutasi').hasClass('in')) $('#modalMutasi').modal('hide');
            } else {
                alert(data.message);
            }
        });
    }
}
</script>


<!-- MODAL IMPORT CSV -->
<div class="modal fade" id="modal-import-csv" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <form id="form-import-csv">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">Import Data Mutasi (CSV)</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Pilih File CSV (.csv)</label>
                        <input type="file" name="file_csv" class="form-control" accept=".csv" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-success"><i class="fa fa-upload"></i> Proses Import</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- MODAL EXPORT CSV -->
<div class="modal fade" id="modal-export-csv" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <form id="form-export-csv" method="GET" action="{?=url(ADMIN."/logistik_non_medis/exportmutasicsv")?}">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">Filter Export CSV</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Kategori Barang</label>
                        <select name="kategori" class="form-control">
                            <option value="">-- Semua Kategori --</option>
                            {loop: $kategori}
                            <option value="{$value.kode_kategori}">{$value.nama_kategori}</option>
                            {/loop}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Bulan</label>
                        <select name="bulan" class="form-control">
                            <option value="01" {if: date('m') == '01'}selected{/if}>Januari</option>
                            <option value="02" {if: date('m') == '02'}selected{/if}>Februari</option>
                            <option value="03" {if: date('m') == '03'}selected{/if}>Maret</option>
                            <option value="04" {if: date('m') == '04'}selected{/if}>April</option>
                            <option value="05" {if: date('m') == '05'}selected{/if}>Mei</option>
                            <option value="06" {if: date('m') == '06'}selected{/if}>Juni</option>
                            <option value="07" {if: date('m') == '07'}selected{/if}>Juli</option>
                            <option value="08" {if: date('m') == '08'}selected{/if}>Agustus</option>
                            <option value="09" {if: date('m') == '09'}selected{/if}>September</option>
                            <option value="10" {if: date('m') == '10'}selected{/if}>Oktober</option>
                            <option value="11" {if: date('m') == '11'}selected{/if}>November</option>
                            <option value="12" {if: date('m') == '12'}selected{/if}>Desember</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Tahun</label>
                        <input type="number" name="tahun" class="form-control" value="{?=date('Y')?}">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" onclick="$('#modal-export-csv').modal('hide')"><i class="fa fa-download"></i> Download CSV</button>
                </div>
            </form>
        </div>
    </div>
</div>


<script>
$('#form-import-csv').submit(function(e) {
    e.preventDefault();
    var formData = new FormData(this);
    $.ajax({
        url: '{?=url(ADMIN."/logistik_non_medis/importmutasicsv")?}',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        success: function(res) {
            var r = JSON.parse(res);
            if (r.status == 'success') {
                $('#modal-import-csv').modal('hide');
                loadDaftarMutasi();
                alert(r.message);
            } else {
                alert(r.message);
            }
        }
    });
});
</script>
