<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <style>
                    .custom-breadcrumb {
                        display: inline-flex;
                        align-items: center;
                        background: #f8f9fa;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 6px 15px;
                        font-size: 13px;
                        margin-bottom: 15px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                    }
                    .custom-breadcrumb a {
                        color: #4a4a4a;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        font-weight: 500;
                    }
                    .custom-breadcrumb a:hover {
                        color: #337ab7;
                    }
                    .custom-breadcrumb .separator {
                        margin: 0 10px;
                        color: #a0a0a0;
                        font-size: 11px;
                    }
                    .custom-breadcrumb .active {
                        color: #337ab7;
                        font-weight: 600;
                    }
                </style>
                <div class="custom-breadcrumb">
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
                    <i class="fa fa-chevron-right separator"></i>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Data Master</a>
                    <i class="fa fa-chevron-right separator"></i>
                    <span class="active">Rekanan</span>
                </div>

                <h3 class="panel-title" style="margin-top: 5px;">Data Rekanan Jasa & Kontrak</h3>
            </div>
            <div class="panel-body">
                <div class="row" style="margin-bottom: 20px;">
                    <div class="col-md-6">
                        <button class="btn btn-dark" style="background-color: #4c5561; color: white; border-radius: 0; padding: 10px 20px;" onclick="openForm()">
                            <i class="fa fa-plus"></i> Tambah Rekanan Baru
                        </button>
                        <button type="button" class="btn btn-warning" data-toggle="modal" data-target="#modal-import-rekanan" style="border-radius: 0; padding: 10px 20px; margin-left: 5px;"><i class="fa fa-upload"></i> Import</button>
                    </div>
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" id="cari" class="form-control" style="height: 42px;" placeholder="Pencarian Nama Rekanan/Kode/Kontrak...">
                            <span class="input-group-btn">
                                <button class="btn btn-default" style="height: 42px; background-color: #f1f4f9;" onclick="loadData(1, $('#cari').val())">
                                    <i class="fa fa-search"></i> Cari
                                </button>
                            </span>
                        </div>
                    </div>
                </div>
                <div id="display">
                    <div class="text-center">
                        <br><br><br>
                        <i class="fa fa-spinner fa-spin fa-3x fa-fw"></i>
                        <p>Memuat data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>

<!-- Modal -->
<div class="modal fade" id="rekananModal" tabindex="-1" role="dialog" aria-labelledby="rekananModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document" style="width: 80%;">
        <div class="modal-content" style="border-radius: 0;">
            <div id="form"></div>
        </div>
    </div>
</div>

<!-- Modal Import Rekanan -->
<div class="modal fade" id="modal-import-rekanan" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="form-import-rekanan" enctype="multipart/form-data">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">Import Data Rekanan Jasa</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Pilih File CSV</label>
                        <input type="file" name="file" class="form-control" accept=".csv" required>
                        <p class="help-block">Pastikan format kolom sesuai dengan template CSV.</p>
                    </div>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'downloadTemplateCSV'])?}?type=rekanan" target="_blank" class="btn btn-default btn-sm"><i class="fa fa-download"></i> Download Template CSV</a>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-import-rekanan">Mulai Import</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
.btn-dark:hover {
    background-color: #3d4550 !important;
    color: white;
}
</style>

<script>
$(document).ready(function() {
    loadData();

    $('#cari').on('keyup', function(e) {
        if (e.keyCode === 13) {
            loadData(1, $(this).val());
        }
    });
});

function loadData(halaman = 1, cari = '') {
    $.post('{?=url([ADMIN, "logistik_non_medis", "displaymasterrekanan"])?}', {halaman: halaman, cari: cari}, function(data) {
        $('#display').html(data);
    });
}

function openForm(kode_rekanan = '', viewOnly = false) {
    $.post('{?=url([ADMIN, "logistik_non_medis", "formmasterrekanan"])?}', {kode_rekanan: kode_rekanan, view_only: viewOnly}, function(data) {
        $('#form').html(data);
        $('#rekananModal').modal('show');
    });
}

function deleteData(kode_rekanan) {
    if(confirm('Apakah Anda yakin ingin menghapus data ini?')) {
        $.post('{?=url([ADMIN, "logistik_non_medis", "hapusmasterrekanan"])?}', {kode_rekanan: kode_rekanan}, function() {
            loadData();
        });
    }
}

$(document).ready(function() {
    $('#form-import-rekanan').on('submit', function(e) {
        e.preventDefault();
        var formData = new FormData(this);
        formData.append('type', 'rekanan');
        var btn = $('#btn-submit-import-rekanan');
        btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Mengimpor...');
        
        $.ajax({
            url: "{?=url([ADMIN, 'logistik_non_medis', 'postImportCSV'])?}",
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(res) {
                var data = JSON.parse(res);
                if (data.status == 'success') {
                    alert(data.message);
                    $('#modal-import-rekanan').modal('hide');
                    loadData(1, $('#cari').val());
                } else {
                    alert(data.message);
                }
            },
            error: function() {
                alert('Terjadi kesalahan saat mengimpor data.');
            },
            complete: function() {
                btn.prop('disabled', false).html('Mulai Import');
            }
        });
    });
});
</script>
