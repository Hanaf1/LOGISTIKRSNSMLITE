<article class="row">
  <div class="col-md-12"><div class="panel panel-default">
    <div class="panel-heading"><h3 class="panel-title"><i class="fa fa-line-chart"></i> Realisasi Belanja BHP</h3></div>
    <div class="panel-body">
      <div class="alert alert-info">Data diambil dari Penerimaan Barang yang berstatus <strong>Selesai</strong> dan stoknya sudah diposting. Nilai memakai qty dan harga satuan dasar; nomor PO ditampilkan bila ada.</div>
      <div class="row" style="margin-bottom:15px;">
        <div class="col-md-2"><label>Bulan</label><select id="realisasi-bulan" class="form-control"><option value="01">Januari</option><option value="02">Februari</option><option value="03">Maret</option><option value="04">April</option><option value="05">Mei</option><option value="06">Juni</option><option value="07">Juli</option><option value="08">Agustus</option><option value="09">September</option><option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option></select></div>
        <div class="col-md-2"><label>Tahun</label><input id="realisasi-tahun" type="number" class="form-control" value="{?=date('Y')?}" min="2000" max="2099"></div>
        <div class="col-md-4" style="padding-top:25px;"><button id="btn-tampil-realisasi" class="btn btn-primary"><i class="fa fa-search"></i> Tampilkan</button> <button id="btn-export-realisasi" class="btn btn-success"><i class="fa fa-file-excel-o"></i> Export XLSX</button></div>
      </div>
      <div id="display-realisasi"><div class="text-center text-muted" style="padding:25px"><i class="fa fa-spinner fa-spin"></i> Memuat realisasi...</div></div>
    </div>
  </div></div>
</article>
<script>
$(function () {
  $('#realisasi-bulan').val('{?=date('m')?}');
  function loadRealisasi() { $('#display-realisasi').load('{?=url([ADMIN,"logistik_non_medis","displayrealisasibelanja"])?}', {bulan:$('#realisasi-bulan').val(), tahun:$('#realisasi-tahun').val()}); }
  $('#btn-tampil-realisasi').on('click', loadRealisasi);
  $('#btn-export-realisasi').on('click', function () { var base = '{?=url([ADMIN,"logistik_non_medis","exportrealisasibelanja"])?}'; window.location.href = base + (base.indexOf('?') === -1 ? '?' : '&') + $.param({bulan:$('#realisasi-bulan').val(), tahun:$('#realisasi-tahun').val()}); });
  loadRealisasi();
});
</script>
