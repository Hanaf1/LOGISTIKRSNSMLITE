<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <style>
                    .custom-breadcrumb {
                        display: inline-flex;
                        align-items: center;
                        background: #f8f9fa;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 6px 15px;
                        font-size: 13px;
                        margin-bottom: 15px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                    }
                    .custom-breadcrumb a {
                        color: #4a4a4a;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        font-weight: 500;
                    }
                    .custom-breadcrumb a:hover {
                        color: #337ab7;
                    }
                    .custom-breadcrumb .separator {
                        margin: 0 10px;
                        color: #a0a0a0;
                        font-size: 11px;
                    }
                    .custom-breadcrumb .active {
                        color: #337ab7;
                        font-weight: 600;
                    }
                </style>
                <div class="custom-breadcrumb">
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
                    <i class="fa fa-chevron-right separator"></i>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Data Master</a>
                    <i class="fa fa-chevron-right separator"></i>
                    <span class="active">Satuan</span>
                </div>

                <h3 class="panel-title" style="margin-top: 5px;">Data Satuan Barang</h3>
            </div>
            <div class="panel-body">
                <div class="row clearfix" style="margin-bottom: 20px;">
                    <div class="col-md-6">
                        <button type="button" class="btn btn-primary" id="btn-tambah-satuan">
                            <i class="fa fa-plus"></i> Tambah Satuan
                        </button>
                        <a href="{?=url([ADMIN, 'logistik_non_medis', 'exportmastersatuan'])?}" target="_blank" class="btn btn-success"><i class="fa fa-download"></i> Export</a>
                        <button type="button" class="btn btn-warning" data-toggle="modal" data-target="#modal-import-satuan"><i class="fa fa-upload"></i> Import</button>
                    </div>
                    <div class="col-md-6">
                        <form class="searchbox-mastersatuan">
                            <div class="input-group">
                                <input type="text" name="cari" class="form-control" placeholder="Cari Kode atau Nama Satuan...">
                                <span class="input-group-btn">
                                    <button class="btn btn-default" type="submit"><i class="fa fa-search"></i> Cari</button>
                                </span>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover no-margin" id="table-master-satuan">
                        <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Nama Satuan</th>
                                <th>Satuan Dasar</th>
                                <th>Nilai Konversi</th>
                                <th class="text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="master-satuan-list">
                            <tr>
                                <td colspan="5" class="text-center">
                                    <i class="fa fa-spinner fa-spin fa-2x"></i>
                                    <p>Memuat data...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="row clearfix" style="margin-top: 15px;">
                    <div class="col-md-12 text-right">
                        <ul class="pagination pagination-sm pagination-master-satuan" style="margin:0;">
                            <!-- Pagination goes here -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>

<!-- Modal Form Satuan -->
<div class="modal fade" id="modal-form-satuan" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">Form Satuan Barang</h4>
            </div>
            <div id="form-satuan-content">
                <!-- AJAX Content -->
            </div>
        </div>
    </div>
</div>

<!-- Modal Import Satuan -->
<div class="modal fade" id="modal-import-satuan" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title">Import Data Satuan</h4>
            </div>
            <form id="form-import-satuan" method="POST" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="alert alert-info">
                        Silakan unduh template format file CSV terlebih dahulu. Pastikan mengisi data sesuai format yang disediakan.
                        <br><br>
                        <a href="{?=url([ADMIN, 'logistik_non_medis', 'downloadtemplatemastersatuan'])?}" class="btn btn-default btn-sm"><i class="fa fa-download"></i> Download Template CSV</a>
                    </div>
                    <div class="form-group">
                        <label>Pilih File CSV <span class="text-danger">*</span></label>
                        <input type="file" name="file" class="form-control" accept=".csv" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-proses-import-satuan">Proses Import</button>
                </div>
            </form>
        </div>
    </div>
</div>
