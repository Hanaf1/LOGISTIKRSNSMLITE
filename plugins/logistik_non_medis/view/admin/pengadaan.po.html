<article class="row">
    <div class="col-md-12">
        <div class="panel panel-default">
            <div class="panel-heading">
                <style>
                    .custom-breadcrumb {
                        display: inline-flex;
                        align-items: center;
                        background: #f8f9fa;
                        border: 1px solid #e1e4e8;
                        border-radius: 6px;
                        padding: 6px 15px;
                        font-size: 13px;
                        margin-bottom: 15px;
                        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
                    }
                    .custom-breadcrumb a {
                        color: #4a4a4a;
                        text-decoration: none;
                        display: inline-flex;
                        align-items: center;
                        font-weight: 500;
                    }
                    .custom-breadcrumb a:hover {
                        color: #337ab7;
                    }
                    .custom-breadcrumb .separator {
                        margin: 0 10px;
                        color: #a0a0a0;
                        font-size: 11px;
                    }
                    .custom-breadcrumb .active {
                        color: #337ab7;
                        font-weight: 600;
                    }
                    #po-vendor-select-wrapper select[name="kode_vendor"] {
                        display: none !important;
                        width: 100% !important;
                    }
                    #po-vendor-select-wrapper > .select2-container {
                        display: block !important;
                        width: 100% !important;
                    }
                    #selectator_kode_vendor {
                        display: none !important;
                    }
                </style>
                <div class="custom-breadcrumb">
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
                    <i class="fa fa-chevron-right separator"></i>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Pengadaan</a>
                    <i class="fa fa-chevron-right separator"></i>
                    <span class="active">PO</span>
                </div>

                <h3 class="panel-title" style="margin-top: 5px;">Purchase Order (PO)</h3>
                <ul class="nav nav-tabs pull-right panel-options">
                    <li><a data-toggle="tab" href="#po-list"><i class="fa fa-table"></i> Daftar PO</a></li>
                    <li class="active"><a data-toggle="tab" href="#po-form" id="btn-add-po"><i class="fa fa-plus"></i> Buat PO Baru</a></li>
                </ul>
            </div>
            <div class="panel-body">
                <div class="tab-content">
                    <!-- Tab List -->
                    <div id="po-list" class="tab-pane fade">
                        <div class="row" style="margin-bottom: 15px;">
                            <div class="col-md-4">
                                <div class="input-group">
                                    <input type="text" id="cari_po" class="form-control" placeholder="Cari No PO / Vendor...">
                                    <span class="input-group-btn">
                                        <button class="btn btn-primary" type="button" id="btn-cari-po"><i class="fa fa-search"></i> Cari</button>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div id="display-po"></div>
                    </div>

                    <!-- Tab Form -->
                    <div id="po-form" class="tab-pane fade in active">
                        <!-- Form dirender di server agar handler rincian PO langsung aktif. -->
                        <div id="form-po">{?= $form_po ?}</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>
<script type="text/javascript">
    $(document).ready(function() {
        function initVendorSelectPO() {
            var selects = $('#form-po select[name="kode_vendor"]');
            if (!selects.length || typeof $.fn.select2 !== 'function') return;

            // Jika form pernah termuat lebih dari sekali, gunakan satu sumber saja.
            selects.slice(1).remove();
            var select = selects.first();

            // mLITE mengaktifkan Selectator untuk semua <select>. Vendor PO
            // hanya boleh memakai Select2 agar tidak tercipta dua widget.
            var selectatorState = select.data('selectator');
            try {
                if (typeof $.fn.selectator === 'function' &&
                    selectatorState && !selectatorState.poSelect2Guard) {
                    select.selectator('destroy');
                }
            } catch (e) {}
            $('#selectator_kode_vendor').remove();
            select.removeClass('selectator');

            // Wrapper harus selalu mengikuti elemen vendor. Template lama yang
            // masih tersimpan di cache pernah menaruh ID ini pada kolom lain.
            $('#form-po #po-vendor-select-wrapper').removeAttr('id');
            var wrapper = select.parent().attr('id', 'po-vendor-select-wrapper');
            wrapper.removeClass('po-select2-ready');

            try {
                if (select.data('select2')) select.select2('destroy');
            } catch (e) {}

            // Bersihkan container Select2 lama sebelum membuat yang baru.
            wrapper.find('.select2-container').remove();
            select.removeAttr('style').show();
            select.select2({ width: '100%', dropdownAutoWidth: false });

            // scripts.js mLITE dijalankan setelah script halaman dan mencoba
            // memasang Selectator ke seluruh select. Sentinel ini membuat
            // initializer Selectator melewati field vendor PO.
            select.data('selectator', { poSelect2Guard: true });

            function enforceSingleVendorSelect() {
                wrapper.addClass('po-select2-ready');
                select.get(0).style.setProperty('display', 'none', 'important');
                var containers = wrapper.find('.select2-container');
                if (containers.length > 1) {
                    containers.slice(0, containers.length - 1).remove();
                }
            }

            enforceSingleVendorSelect();
            setTimeout(enforceSingleVendorSelect, 50);
            setTimeout(enforceSingleVendorSelect, 300);
        }

        function loadPO(halaman = 1) {
            console.log("Loading PO... Page:", halaman);
            var cari = $('#cari_po').val();
            $.ajax({
                url: '{?=url([ADMIN, "logistik_non_medis", "displaypengadaanpo"])?}',
                type: 'POST',
                data: { halaman: halaman, cari: cari },
                success: function(response) {
                    console.log("PO loaded successfully.");
                    $('#display-po').html(response);
                },
                error: function(xhr, status, error) {
                    console.error("Failed to load PO:", status, error);
                    $('#display-po').html('<div class="alert alert-danger">Gagal memuat data PO. Silakan cek koneksi atau log server.</div>');
                }
            });
        }

        $('#btn-cari-po').click(function() {
            loadPO(1);
        });

        $('#cari_po').keypress(function(e) {
            if(e.which == 13) {
                loadPO(1);
            }
        });

        $(document).on('click', '.pagination-po a', function(e) {
            e.preventDefault();
            var halaman = $(this).attr('data-hal');
            loadPO(halaman);
        });

        $('#btn-add-po').click(function() {
            var existingId = $('#form-po input[name="id"]').val();
            if ($('#po-form-data').length && (existingId === '' || typeof existingId === 'undefined')) {
                $('.nav-tabs a[href="#po-form"]').tab('show');
                return;
            }
            openPOForm();
        });

        function openPOForm(sumberTipe, noRencana) {
            $.ajax({
                url: '{?=url([ADMIN, "logistik_non_medis", "formpengadaanpo"])?}',
                type: 'POST',
                data: { sumber_tipe: sumberTipe || '', no_rencana: noRencana || '' },
                success: function(response) {
                    $('#form-po').html(response);
                    initVendorSelectPO();
                    $('.nav-tabs a[href="#po-form"]').tab('show');
                },
                error: function(xhr, status, error) {
                    console.error("Failed to load PO form:", status, error, xhr.responseText);
                    $('#form-po').html('<div class="alert alert-danger">Gagal memuat formulir PO. Silakan cek log server.</div>');
                    $('.nav-tabs a[href="#po-form"]').tab('show');
                }
            });
        }

        $('.nav-tabs a[data-toggle="tab"]').on('shown.bs.tab', function(e) {
            var target = $(e.target).attr('href');

            if (window.history && window.history.replaceState) {
                window.history.replaceState(null, document.title, target);
            }

            if (target === '#po-form' && $.trim($('#form-po').html()) === '') {
                openPOForm();
            } else if (target === '#po-list') {
                loadPO(1);
            }
        });

        $(document).on('click', '.edit-po', function() {
            var id = $(this).data('id');
            $.ajax({
                url: '{?=url([ADMIN, "logistik_non_medis", "formpengadaanpo"])?}',
                type: 'POST',
                data: { id: id },
                success: function(response) {
                    $('#form-po').html(response);
                    initVendorSelectPO();
                    $('.nav-tabs a[href="#po-form"]').tab('show');
                }
            });
        });

        $(document).on('click', '.delete-po', function() {
            var id = $(this).data('id');
            bootbox.confirm({
                title: '<i class="fa fa-trash text-danger"></i> Hapus PO',
                message: 'Yakin ingin menghapus PO ini?',
                buttons: {
                    cancel: { label: '<i class="fa fa-times"></i> Batal', className: 'btn-default' },
                    confirm: { label: '<i class="fa fa-trash"></i> Ya, Hapus', className: 'btn-danger' }
                },
                callback: function(result) {
                    if(!result) return;
                    $.ajax({
                        url: '{?=url([ADMIN, "logistik_non_medis", "hapuspengadaanpo"])?}',
                        type: 'POST',
                        data: { id: id },
                        dataType: 'json',
                        success: function(res) {
                            if(res.status == 'success') {
                                bootbox.alert({ title: '<i class="fa fa-check-circle text-success"></i> Berhasil', message: 'Data berhasil dihapus.', callback: function(){ loadPO(); } });
                            } else {
                                bootbox.alert({ title: '<i class="fa fa-times-circle text-danger"></i> Gagal', message: res.message });
                            }
                        }
                    });
                }
            });
        });

        $(document).on('click', '.update-status-po', function() {
            var id = $(this).data('id');
            var status = $(this).data('status');
            var judul = 'Konfirmasi';
            var pesan = 'Ubah status PO?';
            var btnClass = 'btn-primary';
            var btnLabel = '<i class="fa fa-check"></i> Ya, Lanjutkan';
            if(status == 'Terkirim') {
                judul = '<i class="fa fa-check-circle text-success"></i> Sudah Diorder';
                pesan = 'Tandai PO ini sebagai <b>"Sudah Diorder"</b>?';
                btnClass = 'btn-success';
                btnLabel = '<i class="fa fa-check"></i> Ya, Sudah Order';
            }
            if(status == 'Selesai') {
                judul = '<i class="fa fa-lock text-warning"></i> Tutup PO';
                pesan = 'Tutup PO ini secara manual sebagai <b>Selesai</b>?';
                btnClass = 'btn-warning';
                btnLabel = '<i class="fa fa-lock"></i> Ya, Tutup PO';
            }
            if(status == 'Dibatalkan') {
                judul = '<i class="fa fa-times-circle text-danger"></i> Batalkan PO';
                pesan = 'Yakin membatalkan PO ini? Data perencanaan akan dikembalikan.';
                btnClass = 'btn-danger';
                btnLabel = '<i class="fa fa-times"></i> Ya, Batalkan';
            }

            bootbox.confirm({
                title: judul,
                message: pesan,
                buttons: {
                    cancel: { label: '<i class="fa fa-arrow-left"></i> Kembali', className: 'btn-default' },
                    confirm: { label: btnLabel, className: btnClass }
                },
                callback: function(result) {
                    if(!result) return;
                    $.ajax({
                        url: '{?=url([ADMIN, "logistik_non_medis", "ubahstatuspo"])?}',
                        type: 'POST',
                        data: { id: id, status: status },
                        dataType: 'json',
                        success: function(res) {
                            if(res.status == 'success') {
                                bootbox.alert({ title: '<i class="fa fa-check-circle text-success"></i> Berhasil', message: 'Status PO berhasil diubah.', callback: function(){ loadPO(); } });
                            } else {
                                bootbox.alert({ title: '<i class="fa fa-times-circle text-danger"></i> Gagal', message: res.message });
                            }
                        },
                        error: function(xhr, status, error) {
                            console.error(xhr.responseText);
                            bootbox.alert({ title: '<i class="fa fa-times-circle text-danger"></i> Error', message: 'Terjadi kesalahan saat menghubungi server: ' + error });
                        }
                    });
                }
            });
        });

        var sumber_tipe = '{$sumber_tipe}';
        var no_rencana = '{$no_rencana}';
        initVendorSelectPO();
        if (sumber_tipe !== '' && no_rencana !== '') {
            openPOForm(sumber_tipe, no_rencana);
        } else if (window.location.hash === '#po-form') {
            $('.nav-tabs a[href="#po-form"]').tab('show');
            if ($.trim($('#form-po').html()) === '') {
                openPOForm();
            }
        } else {
            $('.nav-tabs a[href="#po-list"]').tab('show');
            loadPO(1);
        }
    });
</script>
