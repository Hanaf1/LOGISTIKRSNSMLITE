<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Cetak Label Aset - {$aset.kode_aset}</title>
    <style>
        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        .label-sticker {
            width: 90mm;
            height: 40mm;
            margin: 8mm auto;
            border: .45mm solid #000;
            overflow: hidden;
            background: #fff;
        }

        .label-header {
            height: 13mm;
            display: flex;
            border-bottom: .35mm solid #000;
        }

        .logo-box {
            width: 18mm;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: .35mm solid #000;
            padding: 1.2mm;
        }

        .hospital-logo {
            display: block;
            width: 10.5mm;
            height: 10.5mm;
            object-fit: contain;
        }

        .institution-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.15;
            text-align: center;
            text-transform: uppercase;
        }

        .hospital-name {
            font-size: 10pt;
            font-weight: 800;
            letter-spacing: .15mm;
        }

        .label-body {
            height: 26.1mm;
            display: flex;
        }

        .asset-information {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .information-row {
            min-height: 8.7mm;
            display: flex;
            align-items: center;
            border-bottom: .25mm solid #000;
            font-size: 7.5pt;
            line-height: 1.15;
        }

        .information-row:last-child { border-bottom: 0; }

        .information-label {
            flex: 0 0 23mm;
            padding: 1.2mm 1.5mm;
            font-weight: 700;
            text-transform: uppercase;
        }

        .information-value {
            min-width: 0;
            flex: 1;
            padding: 1.2mm 1.5mm 1.2mm 0;
            font-weight: 700;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        .inventory-code {
            font-family: "Courier New", Courier, monospace;
            font-size: 9pt;
            letter-spacing: .08mm;
        }

        .asset-name {
            text-transform: uppercase;
        }

        .qr-box {
            width: 26.1mm;
            flex: 0 0 26.1mm;
            border-left: .35mm solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.2mm;
        }

        .qr-image {
            display: block;
            width: 20mm;
            height: 20mm;
            object-fit: contain;
        }

        .qr-caption {
            margin-top: .7mm;
            font-size: 5.5pt;
            font-weight: 700;
            letter-spacing: .08mm;
            text-transform: uppercase;
        }

        @page {
            size: 90mm 40mm;
            margin: 0;
        }

        @media print {
            .label-sticker { margin: 0; }
        }
    </style>
</head>
<body>
    <div class="label-sticker">
        <div class="label-header">
            <div class="logo-box">
                <img class="hospital-logo" src="{$logo_url}" alt="Logo RSU Nurusyifa">
            </div>
            <div class="institution-box">
                <div class="hospital-name">RSU Nurusyifa</div>
            </div>
        </div>

        <div class="label-body">
            <div class="asset-information">
                <div class="information-row">
                    <div class="information-label">Kode Inventaris</div>
                    <div class="information-value inventory-code">{$aset.kode_label_inventaris}</div>
                </div>
                <div class="information-row">
                    <div class="information-label">Barang</div>
                    <div class="information-value asset-name">{$aset.nama_aset}</div>
                </div>
                <div class="information-row">
                    <div class="information-label">Merk</div>
                    <div class="information-value">{if: !empty($aset.merk_type)}{$aset.merk_type}{else}-{/if}</div>
                </div>
            </div>

            <div class="qr-box">
                <img class="qr-image" src="{$qr_image_url}" alt="QR Code Inventaris">
                <div class="qr-caption">Scan Inventaris</div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', function() {
            window.print();
        });
    </script>
</body>
</html>
