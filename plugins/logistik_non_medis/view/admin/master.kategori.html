                    }

                    }

                    .custom-breadcrumb .active {

                    }
                </style>
                <div class="custom-breadcrumb">

                    <i class="fa fa-chevron-right separator"></i>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Data Master</a>
                    <i class="fa fa-chevron-right separator"></i>

                </div>

                <h3 class="panel-title" style="margin-top: 5px;">Kategori & Klasifikasi</h3>
            </div>
            <div class="panel-body">
                <div class="row clearfix" style="margin-bottom: 20px;">
                    <div class="col-md-6">
                        <button type="button" class="btn btn-primary" id="btn-tambah-kategori">
                            <i class="fa fa-plus"></i> Tambah Kategori
                        </button>
                        <button type="button" class="btn btn-warning" data-toggle="modal" data-target="#modal-import-kategori" style="margin-left: 5px;"><i class="fa fa-upload"></i> Import</button>
                    </div>
                    <div class="col-md-6">
                        <form class="searchbox-masterkategori">
                            <div class="input-group">
                                <input type="text" name="cari" class="form-control" placeholder="Cari Nama Kategori atau Deskripsi...">
                                <span class="input-group-btn">

<th>Nama Kategori</th>

                        </thead>
                        <tbody id="master-kategori-list">

<!-- Modal Form Kategori -->
<div class="modal fade" id="modal-form-kategori" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                <h4 class="modal-title">Form Kategori & Klasifikasi</h4>
            </div>
            <div id="form-kategori-content">
                <!-- AJAX Content -->
            </div>
        </div>
    </div>
</div>

<!-- Modal Import Kategori -->
<div class="modal fade" id="modal-import-kategori" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <form id="form-import-kategori" enctype="multipart/form-data">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">Import Data Kategori</h4>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Pilih File CSV</label>
                        <input type="file" name="file" class="form-control" accept=".csv" required>
                        <p class="help-block">Pastikan format kolom sesuai dengan template CSV.</p>
                    </div>
                    <a href="{?=url([ADMIN, 'logistik_non_medis', 'downloadTemplateCSV'])?}?type=kategori" target="_blank" class="btn btn-default btn-sm"><i class="fa fa-download"></i> Download Template CSV</a>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary" id="btn-submit-import-kategori">Mulai Import</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#form-import-kategori').on('submit', function(e) {
        e.preventDefault();
        var formData = new FormData(this);
        formData.append('type', 'kategori');
        var btn = $('#btn-submit-import-kategori');
        btn.prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> Mengimpor...');
        
        $.ajax({
            url: "{?=url([ADMIN, 'logistik_non_medis', 'postImportCSV'])?}",
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(res) {
                var data = JSON.parse(res);
                if (data.status == 'success') {
                    alert(data.message);
                    $('#modal-import-kategori').modal('hide');
                    if(typeof loadMasterKategori === 'function') {
                        loadMasterKategori(1); // reload datatable
                    } else {
                        location.reload();
                    }
                } else {
                    alert(data.message);
                }
            },
            error: function() {
                alert('Terjadi kesalahan saat mengimpor data.');
            },
            complete: function() {
                btn.prop('disabled', false).html('Mulai Import');
            }
        });
    });
});
</script>
