<div class="row">
    <div class="col-md-12">
        <style>
            .custom-breadcrumb {
                display: inline-flex;
                align-items: center;
                background: #f8f9fa;
                border: 1px solid #e1e4e8;
                border-radius: 6px;
                padding: 6px 15px;
                font-size: 13px;
                margin-bottom: 15px;
                box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            }
            .custom-breadcrumb a {
                color: #4a4a4a;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                font-weight: 500;
            }
            .custom-breadcrumb a:hover {
                color: #337ab7;
            }
            .custom-breadcrumb .separator {
                margin: 0 10px;
                color: #a0a0a0;
                font-size: 11px;
            }
            .custom-breadcrumb .active {
                color: #337ab7;
                font-weight: 600;
            }
            
            .table-report thead th {
                vertical-align: middle !important;
                background-color: #f5f5f5;
                font-weight: bold;
                border-bottom: 2px solid #ddd !important;
            }
            
            .table-report tbody td {
                vertical-align: middle;
            }

            .table-report .group-header {
                background-color: #92d050 !important; /* Match Excel Green */
                color: #000;
                font-weight: bold;
                text-align: center;
            }
        </style>
        <div class="custom-breadcrumb">
            <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}"><i class="fa fa-home"></i></a>
            <i class="fa fa-chevron-right separator"></i>
            <a href="{?=url([ADMIN, 'logistik_non_medis', 'manage'])?}">Manajemen Gudang</a>
            <i class="fa fa-chevron-right separator"></i>
            <span class="active">Stok Opname V2 (Laporan Mutasi)</span>
        </div>

        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title" style="margin-top: 5px;"><i class="fa fa-file-excel-o"></i> Stok Opname V2 (Laporan Mutasi)</h3>
            </div>
            <div class="panel-body">
                <div class="well" style="padding: 15px; margin-bottom: 20px;">
                    <form id="form-filter-opnamev2" class="row">
                        <div class="col-md-2">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="control-label">Tanggal Awal</label>
                                <input type="text" name="tgl_awal" class="form-control datepicker" value="{?=date('Y-m-01')?}">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="control-label">Tanggal Akhir</label>
                                <input type="text" name="tgl_akhir" class="form-control datepicker" value="{?=date('Y-m-d')?}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="control-label">Jenis/Kategori Barang</label>
                                <select name="kategori" class="form-control">
                                    <option value="">-- Semua Jenis Barang --</option>
                                    {loop: $kategori as $kat}<option value="{$kat.kode_kategori}">{$kat.nama_kategori}</option>{/loop}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group" style="margin-bottom: 0;">
                                <label class="control-label">Cari Barang</label>
                                <input type="text" name="cari" class="form-control" placeholder="Kode atau nama barang...">
                            </div>
                        </div>
                        <div class="col-md-1 text-right" style="padding-top: 25px;">
                            <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-search"></i> Tampilkan</button>
                        </div>
                    </form>
                </div>
                
                <div class="text-right" style="margin-bottom: 10px;">
                    <button class="btn btn-success" id="btn-export-excel"><i class="fa fa-file-excel-o"></i> Export to Excel</button>
                </div>
                
                <div class="table-responsive" id="display-opnamev2">
                    <div class="text-center" style="padding: 50px;">
                        <i class="fa fa-info-circle fa-3x text-muted"></i>
                        <p class="text-muted" style="margin-top: 10px;">Silakan klik <strong>Tampilkan</strong> untuk memuat data laporan stok opname.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modal-penyesuaian-opnamev2" tabindex="-1" role="dialog"><div class="modal-dialog" role="document"><div class="modal-content"><form id="form-penyesuaian-opnamev2">
  <div class="modal-header"><button type="button" class="close" data-dismiss="modal">&times;</button><h4 class="modal-title"><i class="fa fa-balance-scale"></i> Penyesuaian Stok per Barang</h4></div>
  <div class="modal-body"><input type="hidden" name="kode_item" id="adj-kode-item"><div class="alert alert-info" style="padding:10px">Jumlah fisik akan menjadi stok saat ini dan selisih dicatat sebagai transaksi <strong>Opname</strong>.</div><dl class="dl-horizontal"><dt>Barang</dt><dd id="adj-nama-barang">-</dd><dt>Stok sistem saat ini</dt><dd><strong id="adj-stok-sistem">0</strong> <span id="adj-satuan"></span></dd></dl><div class="form-group"><label>Jumlah Fisik / Stok Akhir <span class="text-danger">*</span></label><input type="number" min="0" step="0.01" required name="stok_fisik" id="adj-stok-fisik" class="form-control"></div><div class="form-group"><label>Catatan Penyesuaian <span class="text-danger">*</span></label><textarea required name="catatan" class="form-control" rows="3" placeholder="Contoh: selisih hasil hitung fisik rak A atau stok belum tercatat"></textarea></div></div>
  <div class="modal-footer"><button type="button" class="btn btn-default" data-dismiss="modal">Batal</button><button type="submit" class="btn btn-warning" id="btn-simpan-penyesuaian"><i class="fa fa-check"></i> Simpan Penyesuaian</button></div>
</form></div></div></div>

<script>
$(document).ready(function() {
    $('.select2').select2();
    $('.datepicker').datetimepicker({
        format: 'YYYY-MM-DD',
        ignoreReadonly: true,
        locale: 'id'
    });

    var halamanOpnameV2 = 1;
    function loadOpnameV2(halaman) {
        halamanOpnameV2 = halaman || 1;
        $('#display-opnamev2').html('<div class="text-center" style="padding: 50px;"><i class="fa fa-spinner fa-spin fa-3x text-muted"></i><p class="text-muted">Memproses data stok... Ini mungkin membutuhkan waktu beberapa detik.</p></div>');
        var formData = $('#form-filter-opnamev2').serializeArray();
        formData.push({name: 'halaman', value: halamanOpnameV2});
        $.post('{?=url([ADMIN, "logistik_non_medis", "displayopnamev2"])?}', $.param(formData), function(data) {
            $('#display-opnamev2').html(data);
        });
    }
    $('#form-filter-opnamev2').submit(function(e) {
        e.preventDefault();
        loadOpnameV2(1);
    });
    $(document).on('click', '.pagination-opnamev2 a', function(e) { e.preventDefault(); loadOpnameV2($(this).data('page')); });
    $(document).on('click', '.btn-penyesuaian-opnamev2', function() {
        var $btn=$(this); $('#form-penyesuaian-opnamev2')[0].reset(); $('#adj-kode-item').val($btn.data('kode')); $('#adj-nama-barang').text($btn.data('nama')); $('#adj-stok-sistem').text($btn.data('stok')); $('#adj-satuan').text($btn.data('satuan')); $('#modal-penyesuaian-opnamev2').modal('show');
    });
    $('#form-penyesuaian-opnamev2').submit(function(e) {
        e.preventDefault(); var $btn=$('#btn-simpan-penyesuaian').prop('disabled',true).html('<i class="fa fa-spinner fa-spin"></i> Menyimpan...');
        $.post('{?=url([ADMIN, "logistik_non_medis", "simpanpenyesuaianopnamev2"])?}', $(this).serialize(), function(res) {
            if (res.status === 'success') { $('#modal-penyesuaian-opnamev2').modal('hide'); bootbox.alert(res.message, function(){ loadOpnameV2(halamanOpnameV2); }); } else bootbox.alert(res.message || 'Penyesuaian gagal disimpan.');
        }, 'json').fail(function(){ bootbox.alert('Penyesuaian gagal diproses.'); }).always(function(){ $btn.prop('disabled',false).html('<i class="fa fa-check"></i> Simpan Penyesuaian'); });
    });

    $('#btn-export-excel').click(function() {
        if ($('#table-opnamev2').length === 0) {
            alert('Silakan tampilkan data terlebih dahulu sebelum mengekspor ke Excel!');
            return;
        }
        
        // Simple HTML table to Excel Export function
        var tableHtml = document.getElementById("table-opnamev2").outerHTML;
        // Basic Excel CSS styles to maintain the green header
        var style = "<style> .table-report { border-collapse: collapse; } .table-report th, .table-report td { border: 1px solid #000; } .group-header { background-color: #92d050; text-align: center; font-weight: bold; } </style>";
        var htmlTemplate = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:x='urn:schemas-microsoft-com:office:excel' xmlns='http://www.w3.org/TR/REC-html40'><head><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Stok Opname</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->" + style + "</head><body>" + tableHtml + "</body></html>";
        
        var blob = new Blob([htmlTemplate], { type: 'application/vnd.ms-excel' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "Stok_Opname_V2.xls";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
    
    // Auto-load on init
    loadOpnameV2(1);
});
</script>
